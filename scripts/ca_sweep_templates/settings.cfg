model           = multi_phase
logging         = true
console         = true
verbose         = false

output_dir      = ./out/
log_file        = log.txt
timeseries_file = series.txt
output_name     = output
output_csv      = false
output_xdmf     = true        # needed: writes geometry.h5 for cluster_sizes.py
output_all      = false
output_float32  = true
output_deflate  = 0
log_skip        = 500
file_skip       = @FSKIP@      # one field dump per t_a -> 15 per run

size_x          = 160
size_y          = 160
size_z          = 240
velocity_set    = d3q19
threads         = 32
num_subdomains  = 1
use_halfway_bb  = true
domain_geometry = 3d_image
domain_cfg_file = domain.cfg
param_file      = params.cfg

max_iterations  = @ITERS@

acceleration_x  = 0.0
acceleration_y  = 0.0
acceleration_z  = @ACCEL@
forcing_x       = 0.0
forcing_y       = 0.0
forcing_z       = 0.0
forcing_timedep = "constant"
forcing_period  = 10000.0

use_open_bnd    = false
in_out_dir      = 2
use_inlet_pressure  = false
use_outlet_pressure = false
use_inlet_velocity  = false
use_inlet_fluid     = false
use_outlet_fluid    = false
inlet_fluid         = 0
outlet_fluid        = 0
pressure_inlet      = 0.0
pressure_outlet     = 0.0
u_inlet_x           = 0.0
u_inlet_y           = 0.0
u_inlet_z           = 0.0
slabbing_dir    = 0
shift_slabs     = false
load_balancing  = false
buffer_layers   = 2
copy_to_buffers = false
empty_layers    = 0
extrude_buffers = false
image_periodic  = true

fluid_initializer   = checkerboard   # 5 d blocks; see fluid.cfg `length`
fluid_init_filename = fluid.cfg
use_mrt             = true
mrt_lambda          = 0.1875
correct_op_mass     = true      # saturation must hold over 20 t_a

particles_enable        = true
particles_init_mode     = volume
particles_number        = @NTRACER@
particles_dm            = 0.0
particles_int_order     = 2
particles_substeps      = 1
particles_dt            = 1.0
particles_format        = h5
particles_file_skip     = 10000000
particles_overlap       = true

particles_stretching      = true
particles_stretching_file = stretching.txt
particles_stretching_skip = 0
particles_stretching_seed = 20260801

# ---- checkpointing ---------------------------------------------------------
# ON by default, every 5 t_a. Size is 2 * 19 * n_fluid_sites * 8 bytes (h and g,
# always double so a single- and a double-precision build can read each other's
# files): 678 MB at this domain's 2.23M fluid sites, so a 6M-step point keeps
# two of them. Cheap against 782 GB free and against re-running a 130 h point.
# This is not crash insurance, it is the ability to ANSWER "did it converge?"
# without paying for the run twice. The 2D sweep shipped with this off, and
# when the paper turned out to average lambda over t in [30 t_a, 60 t_a]
# against our 15, every completed point had to be thrown away: the h5 field
# dumps hold only macroscopic moments and cannot seed a restart.
#
# 3D matters more than 2D here -- lambda was still decaying at 6 t_a when 2D
# had settled by 4, so the run length these points need is not yet known.
#
# VERIFIED (smoke test, 2D, 1200 steps): restarting from checkpoint_800 against
# a continuous run agrees to 1e-5 relative in both lambda and log_rho -- the
# particle state (rho_hat, log_rho) is written alongside each checkpoint and
# restored, so an extension does NOT restart the orientation transient.
#
# TRAP: after a restart, stretching.txt renumbers from 1 (it writes t minus the
# restart step) while series.txt keeps ABSOLUTE iterations. Add the restart step
# back before converting stretching.txt to t/t_a, or the timing is silently
# wrong by exactly the length of the first leg.
checkpoint_skip = @CKPT@
# restart_file  = ./out/checkpoint_600000.h5

stream_matrix_free = true
grad_matrix_free   = true
fused              = true
fuse_collision     = true
mrt_fast_transform = true
stream_inplace     = true

# one OpenMP thread per PHYSICAL core (measured optimum; 2x that costs ~10%)
particles_threads = @THREADS@
