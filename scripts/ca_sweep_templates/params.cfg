# Two-phase co-flow for the cluster-size test.
# Oh = nu/sqrt(gamma d) = 0.447 -- the 2D Fig-5 value, which keeps Re = Ca/Oh^2
# below 0.5 across the sweep. surface_tension = nu^2/(Oh^2 d) at d = 20.
# interface_width 3.0 = 0.150 d, against the paper eps equivalent of 0.1414 d.
# phi = 6*surface_tension*cos(theta) with theta = 60 deg (the 2D Fig-5 value),
# measured through the wetting fluid; c = 0 is fluid 1 = wetting.
rho0            = 1.000000
rho1            = 1.000000
tau0            = 0.9
tau1            = 0.9
density_solid   = 20.0
interface_width = 3.0
surface_tension = 0.004444
mobility_coeff  = 0.02
phi             = 0.0133320
