################################################################################
# Domain initializer for the MIRRORED, fully periodic 600x600x600 sample.        #
#                                                                                #
# Built from percolating_largest.tif (300^3) by reflecting and gluing in x, y    #
# and z. Reflection makes the pore/grain field continuous across every domain    #
# face AND across the internal seam, so the volume is periodic in all three      #
# directions -> run it with periodic boundary conditions (no inlet/outlet walls).#
#                                                                                #
# Use with:                                                                      #
#     domain_geometry = 3d_image                                                 #
#     domain_cfg_file = domain_percolating_600.cfg                               #
# size_x/size_y/size_z in settings.cfg are overridden by the image (600^3).      #
#                                                                                #
# NOTE: 600^3 is ~2.16e8 voxels. D3Q19 single-phase needs ~16-17 GB just for the #
# distributions; multiphase is far larger. Use coarsening_levels=1 (-> 300^3) or #
# a subvolume if you are RAM-limited.                                            #
################################################################################

image_dir         = ./image_600/   # folder containing ONLY the mirrored stack
                                    # (percolating_mirror_600.tif). Keep it isolated:
                                    # every *.tif in this folder is read, in order.

extension         = tif

interface_solid   = true           # voxel != 0 -> SOLID grain; 0 -> fluid/pore
invert_image      = true

coarsening_levels = 1              # 0 -> full 600^3 ; 1 -> 300^3 (recommended if RAM-limited)

use_subvolume     = false          # keep the whole periodic volume (do NOT crop, or
                                    # you break the mirror periodicity)
x_min             = 0
y_min             = 0
z_min             = 0
subvolume_size_x  = 600
subvolume_size_y  = 600
subvolume_size_z  = 600

add_inlet_pores   = false          # NO added porous buffer layers - they would
add_outlet_pores  = false          # destroy the periodicity. Keep both false.
pores_pitch       = 4
pores_diameter    = 3
