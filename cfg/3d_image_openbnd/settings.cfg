################################################################################
# felbm_gpu example: 3D porous medium from a TIFF stack, OPEN BOUNDARIES.
#
# Pressure-driven flow through a DOWNSAMPLED image (coarsening_levels = 2 in
# domain.cfg -> 150^3), with fluid injected at the inlet and both phases draining
# freely at the outlet. Contrast with cfg/3d_image/, which is the periodic
# body-force-driven version of the same sample.
#
#   ./felbm_gpu cfg/3d_image_openbnd/settings.cfg
#
# GEOMETRY / PERIODICITY. Streaming wraps arithmetically on every axis, but the
# GEOMETRY decides whether that wrap is meaningful -- a population wrapping into a
# solid node just bounces back. With image_periodic = false (required here, see
# below) the initializer stamps ONE SOLID LAYER on each transverse face, so this
# run would have CONFINING SIDE WALLS -- so transverse_periodic = true is set below,
# which removes the padding and the stamped wall on the two axes normal to the flow
# while keeping empty_layers on the flow axis. Result: laterally periodic, open along
# the flow. Set transverse_periodic = false if you want confining side walls instead.
#
# You must supply the image: set image_dir in domain.cfg to a folder containing
# ONLY the stack. Keys marked [gpu] are felbm_gpu-only.
################################################################################

model           = multi_phase
logging         = true
console         = true
verbose         = false

# ---- output ----------------------------------------------------------------
output_dir      = ./out/
log_file        = log.txt
timeseries_file = series.txt
output_name     = output
output_csv      = false
output_xdmf     = true
output_all      = true
output_float32  = true
output_deflate  = 0
log_skip        = 200
file_skip       = 5000

# ---- domain (size_x/y/z are OVERRIDDEN by the image) ----------------------
size_x          = 150
size_y          = 150
size_z          = 150
velocity_set    = d3q19
threads         = 32
num_subdomains  = 1
use_halfway_bb  = true
domain_geometry = 3d_image
domain_cfg_file = domain.cfg
param_file      = params.cfg
# MUST be false with open boundaries: mirroring the image to make it periodic puts
# grains on the inlet/outlet faces, and the buffer-vertex identification then
# asserts ("buffer vertex reference does not exist"). Periodicity in the flow
# direction is meaningless here anyway -- the BC overwrites those planes.
image_periodic  = false
transverse_periodic = true   # no side walls: the two non-flow axes stay periodic

max_iterations  = 50000

# ---- OPEN BOUNDARIES -------------------------------------------------------
# in_out_dir picks the flow axis (0=x, 1=y, 2=z); the inlet/outlet planes are the
# two faces normal to it. empty_layers + extrude_buffers give the solver clear
# fluid layers at those faces to impose on -- without them the vertex
# identification asserts on geometries whose grains touch the boundary.
use_open_bnd    = true
in_out_dir      = 1
empty_layers    = 2
extrude_buffers = true
buffer_layers   = 2
copy_to_buffers = false      # the buffer path is NOT ported to the GPU; keep false

use_inlet_pressure  = true
pressure_inlet      = 1.005
use_outlet_pressure = true
pressure_outlet     = 1.000
use_inlet_velocity  = false  # pressure-driven; set true to impose u_inlet_* instead
u_inlet_x           = 0.0
u_inlet_y           = 0.0
u_inlet_z           = 0.0

# Inject a defined phase at the inlet, and let BOTH phases leave at the outlet.
use_inlet_fluid     = true
inlet_fluid         = 0      # 0 = non-wetting (phi > 0), 1 = wetting
use_outlet_fluid    = false  # false = open drain: outlet takes the local c and rho
outlet_fluid        = 0

# ---- injection schedule ----------------------------------------------------
#   single     one phase throughout (the default)
#   alternate  slugs in time      -> inlet_period, inlet_duty
#   split      side-by-side       -> inlet_split_dir, inlet_split_pos
# inlet_ramp tanh-smooths the switch (steps for alternate, lattice units for
# split). Do not set it to 0 at high density contrast: a step change in the
# composition imposes an interface with no diffuse profile.
inlet_mode          = single
inlet_period        = 10000
inlet_duty          = 0.5
inlet_ramp          = 200
inlet_split_dir     = x
inlet_split_pos     = 75

# ---- forcing: none. The pressure difference drives the flow. ---------------
acceleration_x  = 0.0
acceleration_y  = 0.0
acceleration_z  = 0.0
forcing_x       = 0.0
forcing_y       = 0.0
forcing_z       = 0.0
forcing_timedep = "constant"
forcing_period  = 10000.0
slabbing_dir    = 0
shift_slabs     = false
load_balancing  = false

# ---- physics ---------------------------------------------------------------
fluid_initializer   = uniform
fluid_init_filename = uniform.cfg
use_mrt             = true
mrt_lambda          = 0.1875
# MUST be false with open boundaries: fluid enters and leaves, so the total
# order parameter is legitimately not conserved and the corrector would fight
# the flow. felbm_gpu aborts if this is true.
correct_op_mass     = false

# ---- passive tracers -------------------------------------------------------
particles_enable    = false

# ---- performance (all validated exact) -------------------------------------
stream_matrix_free = true
grad_matrix_free   = true
fused              = true
fuse_collision     = true
mrt_fast_transform = true
stream_inplace     = true
