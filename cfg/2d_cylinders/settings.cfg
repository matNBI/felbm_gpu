################################################################################
# felbm_gpu example 1 of 2: 2D porous medium, AUTO-GENERATED geometry.
#
# Quasi-2D (size_z = 1) random cylinder pack, body-force driven, fully periodic,
# MRT, with a slab initial condition and passive tracers on both interfaces.
# Nothing external is needed: the geometry is generated from domain.cfg.
#
#   ./felbm_gpu cfg/2d_cylinders/settings.cfg
#
# All paths are relative to the working directory, so run it from a copy of this
# folder. Keys marked [gpu] are felbm_gpu-only (unknown to felbm_local).
################################################################################

model           = multi_phase
logging         = true
console         = true
verbose         = false

# ---- output ----------------------------------------------------------------
output_dir      = ./out/
log_file        = log.txt
timeseries_file = series.txt
output_name     = output
output_csv      = false
output_xdmf     = true
output_all      = true
output_float32  = true        # [gpu] half-size output, ample for viz
output_deflate  = 0           # [gpu] gzip 0-9; keep 0 so ParaView can read it
log_skip        = 500         # cheap (GPU-side reductions)
file_skip       = 20000       # field snapshots; each costs a D2H + HDF5 write

# ---- domain ----------------------------------------------------------------
# size_z = 1 => quasi-2D. The 2D z-Brownian kick is suppressed automatically.
size_x          = 1024
size_y          = 2048
size_z          = 1
velocity_set    = d3q19
threads         = 32
num_subdomains  = 1
use_halfway_bb  = true
domain_geometry = cylinders_repulsive
domain_cfg_file = domain.cfg
param_file      = params.cfg

max_iterations  = 100000

# ---- forcing (periodic co-flow; no open boundaries) ------------------------
# Bo = a * ell^2 * rho_bar / gamma ; ell = characteristic pore size.
acceleration_x  = 0.0
acceleration_y  = 3.3e-05
acceleration_z  = 0.0
forcing_x       = 0.0
forcing_y       = 0.0
forcing_z       = 0.0
forcing_timedep = "constant"
forcing_period  = 10000.0

# ---- unused-but-parsed boundary/decomposition keys ------------------------
use_open_bnd    = false
in_out_dir      = 1
# The felbm_local parser prints "Error! Variable ... not found" for these if they
# are absent, even though use_open_bnd = false makes them inert. Set them to keep
# the run log clean.
use_inlet_pressure  = false
use_outlet_pressure = false
use_inlet_velocity  = false
use_inlet_fluid     = false
use_outlet_fluid    = false
inlet_fluid         = 0
outlet_fluid        = 0
pressure_inlet      = 0.0
pressure_outlet     = 0.0
u_inlet_x           = 0.0
u_inlet_y           = 0.0
u_inlet_z           = 0.0
slabbing_dir    = 0
shift_slabs     = false
load_balancing  = false
buffer_layers   = 2
copy_to_buffers = false
empty_layers    = 0
extrude_buffers = false
image_periodic  = true

# ---- physics ---------------------------------------------------------------
fluid_initializer   = slab_interface   # TWO smoothed interfaces => periodic-safe
fluid_init_filename = fluid.cfg
use_mrt             = true
mrt_lambda          = 0.1875
correct_op_mass     = true             # see README "Order-parameter mass correction"

# ---- passive tracers -------------------------------------------------------
particles_enable        = true
particles_init_mode     = plane_xz     # planes normal to the flow (y)
particles_plane_offsets = "512, 1536"  # the two slab interfaces
particles_number        = 12000        # 2 planes x 6 Dm groups x 1000
particles_dm_groups     = "0:1000, 1e-5:1000, 1e-4:1000, 1e-3:1000, 1e-2:1000, 1e-1:1000"
particles_int_order     = 2
particles_substeps      = 1
particles_dt            = 1.0
particles_format        = h5
particles_file_skip     = 400
particles_overlap       = true         # [gpu] hide host tracer work behind GPU

# ---- performance (all validated exact; see README) -------------------------
stream_matrix_free = true
grad_matrix_free   = true
fused              = true
fuse_collision     = true
mrt_fast_transform = true     # [gpu] real_t MRT transform
stream_inplace     = true     # [gpu] no h2/g2 ping-pong

# ---- checkpointing (optional) ---------------------------------------------
# checkpoint_skip = 20000     # [gpu] write checkpoint_<step>.h5 every N steps
# restart_file    = ./out/checkpoint_20000.h5   # [gpu] resume from one
